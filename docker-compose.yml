# docker-compose.yml

services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro
      - ./data:/app/data:ro
      - ./templates:/app/templates:ro
      - ./eval:/app/eval:ro
      - talkquote_db:/app/db
      - talkquote_audio:/app/storage/audio
    environment:
      - TALKQUOTE_OLLAMA_HOST=http://ollama:11434
      - TALKQUOTE_DATABASE_PATH=/app/db/talkquote.sqlite
      - TALKQUOTE_AUDIO_STORAGE_DIR=/app/storage/audio
      - TALKQUOTE_DEBUG=false
      - TALKQUOTE_WHISPER_LOCAL_FILES_ONLY=true
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  talkquote_db:
  talkquote_audio:
  ollama_models: