# .github/workflows/ci.yml

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Run linter
        run: uv run ruff check app/ tests/ eval/

      - name: Run typecheck
        run: uv run mypy app/ tests/ eval/ || echo "mypy not yet configured, skipping"

      - name: Run unit tests + no-network + schema-guard + matcher eval
        run: |
          uv run pytest tests/ -v -x --tb=short \
            -k "not audio" \
            --socket-allow=unix